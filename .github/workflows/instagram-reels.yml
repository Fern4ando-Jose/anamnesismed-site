name: Instagram Reels — AnamnesísMed

# Pipeline GRÁTIS de Reels (vídeo) para o @anamnesismed.
# Renderiza um Reel com Remotion no GitHub Actions (tem Chromium + ffmpeg),
# sobe o mp4 para o Vercel Blob (URL pública) e publica via /api/publish-reel.
#
# Roda 1x/dia às 21:00 UTC (18:00 BRT) + disparo manual (workflow_dispatch).

on:
  # Agendamento automático DESLIGADO até o Nível 3 (footage) estar aprovado.
  # Reativar depois descomentando o bloco schedule abaixo.
  # schedule:
  #   - cron: "0 21 * * *" # 21:00 UTC = 18:00 BRT
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot usado para buscar o conteúdo (preview)"
        required: false
        default: "noite"
        type: choice
        options: [manha, tarde, noite]
      dryrun:
        description: "Só renderizar e subir pro Blob (NÃO publica no Instagram)"
        required: false
        default: false
        type: boolean

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 2. Configura Node 20 com cache de npm da app
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: instagram-automation/package-lock.json

      # 3. Instala dependências (inclui Remotion). O Remotion baixa o Chromium
      #    Headless Shell automaticamente no primeiro render.
      #    Usamos `npm install` (e não `npm ci`) porque o package-lock.json pode
      #    ainda não ter sido regenerado com as deps de Reel; `install` sincroniza.
      - name: Instalar dependências
        working-directory: instagram-automation
        run: npm install --no-audit --no-fund

      # 4. Define o slot (do input manual ou "noite" no agendamento)
      - name: Definir slot
        id: slot
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          SLOT="${SLOT:-noite}"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Slot escolhido: $SLOT"

      # 5. Busca o conteúdo no /api/publish?preview=1 (gera título/slides/cta via Claude,
      #    SEM publicar) e monta o REEL_PROPS que o render vai consumir.
      - name: Obter conteúdo (preview) e montar REEL_PROPS
        id: content
        run: |
          # Chama o endpoint de prévia (autenticado pelo CRON_SECRET)
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://anamnesismed-ig.vercel.app/api/publish?preview=1&slot=${{ steps.slot.outputs.slot }}" \
            -o preview.json
          echo "Prévia recebida:"
          cat preview.json | head -c 400; echo

          # Extrai a keyword da capa a partir do título (1ª palavra "forte")
          # e monta os inputProps esperados pela composição Reel.
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("preview.json", "utf8"));
            const STOP = new Set(["e","o","a","de","do","da","para","na","no","em","com","por","um","uma","se","ao","as","os","das","dos","quando","mais"]);
            const title = p.title || "Anamnese clínica";
            const kw = ((title.split(/\s+/).find(w => !STOP.has(w.toLowerCase())) || title.split(" ")[0]) || "ANAMNESE")
              .toUpperCase().replace(/[^A-ZÁÉÍÓÚÜÃÕÂÊÔÎÛÀÈÌÒÙÇ]/g, "") || "ANAMNESE";
            const props = {
              title,
              slides: Array.isArray(p.slides) ? p.slides : [],
              accentWords: Array.isArray(p.accentWords) ? p.accentWords : [],
              cta: p.cta || "Qual sua conduta?",
              kw,
              ed: "000",
              videoKeywords: Array.isArray(p.videoKeywords) ? p.videoKeywords : [],
              // Trilha de fundo por slot (sem narração). Arquivos em public/music/.
              music: "music/bed-" + (({manha:0,tarde:1,noite:2})["${{ steps.slot.outputs.slot }}"] ?? 0) + ".mp3"
            };
            // Caption do reel: usa a legenda gerada pelo Claude (mesma do carrossel)
            fs.writeFileSync("caption.txt", p.caption || title);
            fs.writeFileSync("reel-props.json", JSON.stringify(props));
            console.log("REEL_PROPS montado:", JSON.stringify(props).slice(0, 300));
          '

      # 5.5 Busca footage real (banco grátis Pexels) e injeta clips[] no reel-props.json.
      #      Em qualquer falha / sem chave, segue sem footage (fundo teal sólido).
      - name: Buscar footage (banco Pexels)
        working-directory: instagram-automation
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/fetch-stock.mjs ../reel-props.json

      # 6. Renderiza o Reel (footage + texto + trilha de fundo) para out/reel.mp4
      #    Decisão 2026-06-18: reels SEM narração (a pt-br gratuita do Kokoro soava
      #    europeia) → só trilha. O music é injetado no passo acima (por slot).
      - name: Renderizar Reel (Remotion)
        working-directory: instagram-automation
        run: node scripts/render-reel.mjs --props=../reel-props.json

      # 7. Sobe o mp4 para o Vercel Blob e captura a URL pública (stdout)
      - name: Upload do mp4 para o Vercel Blob
        id: upload
        working-directory: instagram-automation
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          URL=$(node scripts/upload-blob.mjs)
          echo "URL do vídeo: $URL"
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"
          echo "🎬 **Vídeo renderizado:** $URL" >> "$GITHUB_STEP_SUMMARY"

      # 8. Publica o Reel no Instagram via /api/publish-reel (faz o polling de status)
      #    Pulado no modo dry-run (só renderiza + sobe pro Blob para pré-visualização).
      - name: Publicar Reel no Instagram
        if: ${{ github.event.inputs.dryrun != 'true' }}
        run: |
          # Caption precisa ser url-encoded; usamos --data-urlencode no curl (GET via -G)
          curl -fsS --max-time 240 -G \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --data-urlencode "video=${{ steps.upload.outputs.video_url }}" \
            --data-urlencode "caption@caption.txt" \
            --data-urlencode "slot=${{ steps.slot.outputs.slot }}" \
            "https://anamnesismed-ig.vercel.app/api/publish-reel"
          echo
          echo "Reel publicado."
