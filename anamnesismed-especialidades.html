<!DOCTYPE html>
<html lang="es" data-lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnamnesísMed — Nova HC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f4f8;--bg-card:#ffffff;
  --ink:#0d2d3d;--primary:#0e7490;--primary-dark:#0c5f72;
  --secondary:#0d9488;--accent:#f59e0b;
  --muted:#4b6070;--line:rgba(13,45,61,0.10);--line-md:rgba(13,45,61,0.16);
  --serif:'Libre Baskerville',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --sidebar-w:240px
}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:flex}
[data-lang="es"] .pt{display:none!important}
[data-lang="pt"] .es{display:none!important}

/* ── SIDEBAR ── */
/* ── MAIN ── */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{
  background:var(--bg-card);
  border-bottom:1px solid var(--line);
  padding:0 28px;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;gap:12px
}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--ink);flex-shrink:0}
.hamburger:hover{background:var(--bg)}
.topbar-back{
  display:flex;align-items:center;gap:5px;
  font-size:13px;font-weight:600;color:var(--muted);
  text-decoration:none;padding:5px 8px;border-radius:6px;
  transition:background .15s,color .15s;white-space:nowrap;flex-shrink:0
}
.topbar-back:hover{background:var(--bg);color:var(--ink)}
.topbar-sep{color:var(--line-md);font-size:16px;flex-shrink:0}
.topbar-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.lang-toggle{display:flex;background:rgba(13,45,61,.06);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.lang-btn{padding:4px 11px;font-size:11px;font-weight:700;letter-spacing:.5px;border:none;background:transparent;cursor:pointer;color:var(--muted);transition:all .2s}
.lang-btn.active{background:var(--ink);color:#fff;border-radius:20px}

/* ── PAINEL DE CONTEÚDO ── */
.panel{flex:1;padding:28px 32px 48px;overflow-y:auto}

/* ── EMPTY STATE ── */
.empty-state{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:60vh;
  text-align:center;gap:12px
}
.es-icon{font-size:52px}
.es-title{font-size:17px;font-weight:700;color:var(--ink)}
.es-sub{font-size:14px;color:var(--muted);max-width:300px;line-height:1.6}
/* cards de atalho no empty state */
.esp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;max-width:600px;width:100%;margin-top:8px}
.esp-card{
  background:var(--bg-card);border:1px solid var(--line);
  border-radius:12px;padding:18px 16px;
  cursor:pointer;border:none;text-align:left;
  transition:all .18s;display:flex;flex-direction:column;gap:8px
}
.esp-card:hover{box-shadow:0 4px 16px rgba(13,45,61,.08);transform:translateY(-2px);border-color:rgba(14,116,144,.25)}
.esp-card:hover{border:1px solid rgba(14,116,144,.25)}
.ecard-icon{font-size:28px}
.ecard-name{font-size:14px;font-weight:700;color:var(--ink)}
.ecard-count{font-size:12px;color:var(--muted)}

/* ── PAINEL DE ESPECIALIDADE ── */
.panel-head{margin-bottom:24px}
.panel-esp-title{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink);margin-bottom:4px}
.panel-esp-sub{font-size:14px;color:var(--muted)}

/* ── TABS ── */
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:24px}
.tab-btn{
  padding:10px 20px;font-size:13px;font-weight:600;
  color:var(--muted);border:none;background:transparent;
  cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all .2s
}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ── MOTIVOS ── */
.cat-block{margin-bottom:28px}
.cat-label{
  font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px solid var(--line)
}
.motivos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:10px
}
.motivo-card{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;
  background:var(--bg-card);
  border:1px solid var(--line);
  border-radius:10px;
  text-decoration:none;color:var(--ink);
  transition:all .18s
}
.motivo-card:hover{
  border-color:rgba(14,116,144,.3);
  box-shadow:0 4px 14px rgba(13,45,61,.07);
  transform:translateY(-1px)
}
.motivo-card:active{transform:translateY(0)}
.m-icon{font-size:22px;flex-shrink:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg)}
.m-name{font-size:13px;font-weight:600;flex:1}
.m-arrow{color:var(--muted);font-size:18px;flex-shrink:0}

/* ── MATERIAL PLACEHOLDER ── */
.material-placeholder{
  display:flex;flex-direction:column;align-items:center;
  padding:60px 20px;text-align:center;gap:10px
}
.mp-icon{font-size:44px}
.mp-title{font-size:16px;font-weight:700;color:var(--ink)}
.mp-sub{font-size:14px;color:var(--muted);max-width:320px;line-height:1.5}
.mp-badge{display:inline-block;padding:4px 14px;background:rgba(14,116,144,.1);color:var(--primary);border-radius:20px;font-size:12px;font-weight:700;margin-top:4px}

/* ── MOBILE NAV ── */
.mobile-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:var(--bg-card);border-top:1px solid var(--line);
  z-index:200;padding-bottom:env(safe-area-inset-bottom)
}
.mn-row{display:flex;align-items:stretch}
.mn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:10px 4px;
  font-size:10px;font-weight:600;color:var(--muted);
  text-decoration:none;background:none;border:none;cursor:pointer;transition:color .15s
}
.mn-item.active,.mn-item:active{color:var(--primary)}
.mn-icon{font-size:20px}

/* ── ESP DRAWER (mobile) ── */
.esp-drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(13,45,61,.5);z-index:150}
.esp-drawer-backdrop.open{display:block}
.esp-drawer{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg-card);border-radius:16px 16px 0 0;
  z-index:160;transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:70vh;overflow:hidden;display:flex;flex-direction:column
}
.esp-drawer.open{transform:translateY(0)}
.esp-drawer-head{
  padding:16px 20px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0
}
.esp-drawer-title{font-size:15px;font-weight:700;color:var(--ink)}
.esp-drawer-close{background:var(--bg);border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.esp-drawer-list{overflow-y:auto;padding:10px 12px 24px;display:flex;flex-direction:column;gap:4px}
.esp-drawer-btn{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;border-radius:10px;
  font-size:14px;font-weight:600;color:var(--muted);
  border:1px solid var(--line);background:var(--bg-card);cursor:pointer;
  transition:all .18s;text-align:left;width:100%
}
.esp-drawer-btn:hover,.esp-drawer-btn:active{background:var(--bg);color:var(--ink)}
.esp-drawer-btn.active{background:rgba(14,116,144,.08);color:var(--primary);border-color:rgba(14,116,144,.25)}
.esp-drawer-btn .edb-icon{font-size:22px;flex-shrink:0}
.esp-drawer-btn .edb-count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}

/* ── SIDEBAR BACKDROP ── */

/* ── RESPONSIVO ── */
@media(max-width:768px){
  .main{margin-left:0}
  .mobile-nav{display:block}
  .panel{padding:16px 14px 90px}
  .topbar{padding:0 14px;height:52px}
  .motivos-grid{grid-template-columns:1fr}
  .hamburger{display:flex}
  .topbar-back span{display:none}
  .topbar-back::before{content:'←'}
  .panel-esp-title{font-size:20px}
}
@media(max-width:480px){
  .panel{padding:14px 12px 90px}
  .topbar-title{font-size:14px}
  .esp-cards{grid-template-columns:1fr 1fr}
}
@media(min-width:769px) and (max-width:1100px){
  .panel{padding:20px 22px 40px}
  .motivos-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}
</style>

</head>
<body>

<div id="sidebar-root"></div>

<div class="main">

</nav>

<!-- ESP DRAWER (mobile) -->
<div class="esp-drawer-backdrop" id="esp-drawer-backdrop" onclick="closeEspDrawer()"></div>
<div class="esp-drawer" id="esp-drawer">
  <div class="esp-drawer-head">
    <span class="esp-drawer-title pt">Especialidades</span>
    <span class="esp-drawer-title es">Especialidades</span>
    <button class="esp-drawer-close" onclick="closeEspDrawer()">✕</button>
  </div>
  <div class="esp-drawer-list" id="esp-drawer-list"><!-- preenchido por JS --></div>
</div>

<script>
// ── DADOS ────────────────────────────────────────────────────────────────────
const ESPECIALIDADES = [
  {
    id:"semiologia", icon:"📖",
    namePt:"Semiologia", nameEs:"Semiología",
    cats:[
      { catPt:"Dor e Dispneia", catEs:"Dolor y Disnea", items:[
        {id:"semio-dor",    namePt:"Dor",            nameEs:"Dolor",          icon:"🔴"},
        {id:"semio-disnea", namePt:"Dispneia",        nameEs:"Disnea",         icon:"🫁"},
        {id:"semio-tosse",  namePt:"Tosse",           nameEs:"Tos",            icon:"😤"}
      ]},
      { catPt:"Sinais Clínicos", catEs:"Signos Clínicos", items:[
        {id:"semio-cianose",   namePt:"Cianose",    nameEs:"Cianosis",   icon:"🔵"},
        {id:"semio-edema",     namePt:"Edema",      nameEs:"Edema",      icon:"💧"},
        {id:"semio-ictericia", namePt:"Icterícia",  nameEs:"Ictericia",  icon:"🟡"}
      ]},
      { catPt:"Sintomas Constitucionais", catEs:"Síntomas Constitucionales", items:[
        {id:"semio-febre",   namePt:"Febre",              nameEs:"Fiebre",         icon:"🌡️"},
        {id:"semio-astenia", namePt:"Astenia / Fadiga",   nameEs:"Astenia / Fatiga",icon:"😴"},
        {id:"semio-peso",    namePt:"Alteração de Peso",  nameEs:"Cambio de Peso", icon:"⚖️"}
      ]}
    ]
  },
  {
    id:"clinica", icon:"🏥",
    namePt:"Clínica Médica", nameEs:"Clínica Médica",
    cats:[
      { catPt:"Cardiorrespiratório", catEs:"Cardiorrespiratorio", items:[
        {id:"dor-toracica", namePt:"Dor Torácica",  nameEs:"Dolor Torácico",  icon:"❤️"},
        {id:"dispneia",     namePt:"Dispneia",      nameEs:"Disnea",          icon:"🫁"},
        {id:"palpitacoes",  namePt:"Palpitações",   nameEs:"Palpitaciones",   icon:"💓"}
      ]},
      { catPt:"Neurológico", catEs:"Neurológico", items:[
        {id:"cefaleia",          namePt:"Cefaleia",          nameEs:"Cefalea",            icon:"🧠"},
        {id:"convulsao-sincope", namePt:"Convulsão / Síncope",nameEs:"Convulsión / Síncope",icon:"⚡"},
        {id:"tontura-vertigem",  namePt:"Tontura / Vertigem", nameEs:"Mareo / Vértigo",    icon:"🌀"}
      ]},
      { catPt:"Infeccioso / Geral", catEs:"Infeccioso / General", items:[
        {id:"febre",      namePt:"Febre",         nameEs:"Fiebre",        icon:"🌡️"},
        {id:"perda-peso", namePt:"Perda de Peso", nameEs:"Pérdida de Peso",icon:"⚖️"}
      ]},
      { catPt:"Gastrointestinal", catEs:"Gastrointestinal", items:[
        {id:"dor-abdominal",   namePt:"Dor Abdominal",   nameEs:"Dolor Abdominal",  icon:"🫃"},
        {id:"ictericia",       namePt:"Icterícia",       nameEs:"Ictericia",        icon:"🟡"},
        {id:"nauseas-vomitos", namePt:"Náuseas / Vômitos",nameEs:"Náuseas / Vómitos",icon:"🤢"},
        {id:"diarreia",        namePt:"Diarreia",        nameEs:"Diarrea",          icon:"💧"}
      ]},
      { catPt:"Outros", catEs:"Otros", items:[
        {id:"edema",              namePt:"Edema",           nameEs:"Edema",          icon:"💧"},
        {id:"tosse",              namePt:"Tosse",           nameEs:"Tos",            icon:"😤"},
        {id:"sintomas-urinarios", namePt:"Sint. Urinários", nameEs:"Sint. Urinarios",icon:"🫧"},
        {id:"lombalgia",          namePt:"Lombalgia",       nameEs:"Lumbalgia",      icon:"🦴"},
        {id:"artralgia",          namePt:"Artralgia",       nameEs:"Artralgia",      icon:"🦵"}
      ]}
    ]
  },
  {
    id:"cirurgia", icon:"🔪",
    namePt:"Cirurgia Geral", nameEs:"Cirugía General",
    cats:[
      { catPt:"Abdome Agudo", catEs:"Abdomen Agudo", items:[
        {id:"apendicite",              namePt:"Apendicite",          nameEs:"Apendicitis",          icon:"🔴"},
        {id:"colecistite-colelitiase", namePt:"Colecistite / Colelitíase",nameEs:"Colecistitis / Colelitiasis",icon:"🟠"},
        {id:"pancreatite-aguda",       namePt:"Pancreatite Aguda",   nameEs:"Pancreatitis Aguda",   icon:"🟡"},
        {id:"oclusao-intestinal",      namePt:"Oclusão Intestinal",  nameEs:"Oclusión Intestinal",  icon:"🟤"}
      ]},
      { catPt:"Hérnias", catEs:"Hernias", items:[
        {id:"hernia-abdominal", namePt:"Hérnia Abdominal", nameEs:"Hernia Abdominal", icon:"🫁"}
      ]},
      { catPt:"Hemorragia Digestiva", catEs:"Hemorragia Digestiva", items:[
        {id:"hemorragia-digestiva-alta",  namePt:"Hemorragia Digestiva Alta", nameEs:"Hemorragia Digestiva Alta", icon:"🩸"},
        {id:"hemorragia-digestiva-baixa", namePt:"Hemorragia Digestiva Baixa",nameEs:"Hemorragia Digestiva Baja", icon:"🩸"}
      ]},
      { catPt:"Doenças Colorretais", catEs:"Enfermedades Colorrectales", items:[
        {id:"doenca-diverticular", namePt:"Doença Diverticular", nameEs:"Enfermedad Diverticular",   icon:"🫃"},
        {id:"doencas-anorretais",  namePt:"Doenças Anorretais",  nameEs:"Enfermedades Anorrectales", icon:"🔴"}
      ]},
      { catPt:"Trauma", catEs:"Trauma", items:[
        {id:"trauma-abdominal", namePt:"Trauma Abdominal", nameEs:"Trauma Abdominal", icon:"🚨"}
      ]}
    ]
  },
  {
    id:"respiratorio", icon:"🫁",
    namePt:"Respiratório", nameEs:"Respiratorio",
    cats:[
      { catPt:"Sintomas Respiratórios", catEs:"Síntomas Respiratorios", items:[
        {id:"semio-tosse",  namePt:"Tosse",          nameEs:"Tos",             icon:"😮‍💨"},
        {id:"expectoracao", namePt:"Expectoração",   nameEs:"Expectoración",   icon:"🫧"},
        {id:"hemoptise",    namePt:"Hemoptise",      nameEs:"Hemoptisis",      icon:"🩸"},
        {id:"dispneia",     namePt:"Dispneia",       nameEs:"Disnea",          icon:"🫁"},
        {id:"dor-toracica", namePt:"Dor Torácica",   nameEs:"Dolor Torácico",  icon:"❤️"}
      ]}
    ]
  }
];

// ── ESTADO ────────────────────────────────────────────────────────────────────
let currentEsp = null;
let currentTab = "hc";
let currentLang = "es";

function espName(e){ return currentLang==="es" ? (e.nameEs||e.namePt) : e.namePt; }
function catName(c){ return currentLang==="es" ? (c.catEs||c.catPt) : c.catPt; }
function mName(m){  return currentLang==="es" ? (m.nameEs||m.namePt) : m.namePt; }
function totalM(e){ return e.cats.reduce((s,c)=>s+c.items.length,0); }

// ── RENDER SIDEBAR ESP NAV ────────────────────────────────────────────────────
function renderSidebarEsp(){
  const list = document.getElementById("esp-nav-list");
  if(!list) return;
  list.innerHTML = ESPECIALIDADES.map(esp => {
    const active = currentEsp && currentEsp.id === esp.id;
    return `<button class="esp-nav-item${active?" active":""}" onclick="selectEsp('${esp.id}');closeSidebar()">
      <span class="nav-dot"></span>
      <span style="flex:1;text-align:left">${espName(esp)}</span>
      <span class="esp-nav-count">${totalM(esp)}</span>
    </button>`;
  }).join("");
}

// ── RENDER DRAWER MOBILE ──────────────────────────────────────────────────────
function renderDrawer(){
  const list = document.getElementById("esp-drawer-list");
  list.innerHTML = ESPECIALIDADES.map(esp => {
    const active = currentEsp && currentEsp.id === esp.id;
    return `<button class="esp-drawer-btn${active?" active":""}" onclick="selectEsp('${esp.id}');closeEspDrawer()">
      <span class="edb-icon">${esp.icon}</span>
      <span>${espName(esp)}</span>
      <span class="edb-count">${totalM(esp)}</span>
    </button>`;
  }).join("");
}

// ── RENDER PANEL ──────────────────────────────────────────────────────────────
function renderPanel(){
  const panel = document.getElementById("panel");
  const sep   = document.getElementById("topbar-sep");
  const ttPt  = document.getElementById("topbar-title-pt");
  const ttEs  = document.getElementById("topbar-title-es");

  if(!currentEsp){
    sep.style.display="none"; ttPt.style.display="none"; ttEs.style.display="none";
    const cards = ESPECIALIDADES.map(esp=>`
      <button class="esp-card" onclick="selectEsp('${esp.id}')">
        <div class="ecard-icon">${esp.icon}</div>
        <div class="ecard-name">${espName(esp)}</div>
        <div class="ecard-count">${totalM(esp)} motivos</div>
      </button>`).join("");
    panel.innerHTML=`
      <div class="empty-state">
        <div class="es-icon">📋</div>
        <div class="es-title pt">Escolha a especialidade</div>
        <div class="es-title es">Elige la especialidad</div>
        <div class="es-sub pt">Selecione para começar uma nova HC</div>
        <div class="es-sub es">Selecciona para comenzar una nueva HC</div>
        <div class="esp-cards">${cards}</div>
      </div>`;
    return;
  }

  // Topbar breadcrumb
  sep.style.display="";
  ttPt.style.display=""; ttPt.textContent=currentEsp.namePt;
  ttEs.style.display=""; ttEs.textContent=currentEsp.nameEs||currentEsp.namePt;

  const tabHc  = currentLang==="es"?"Nueva HC":"Nova HC";
  const tabMat = currentLang==="es"?"Referencia Clínica":"Referência Clínica";
  const subPt  = `${totalM(currentEsp)} motivos disponíveis`;
  const subEs  = `${totalM(currentEsp)} motivos disponibles`;

  let hcHtml="";
  currentEsp.cats.forEach(cat=>{
    const items=cat.items.map(m=>`
      <a href="anamnesismed-app.html?esp=${currentEsp.id}&motivo=${m.id}" class="motivo-card">
        <div class="m-icon">${m.icon}</div>
        <div class="m-name">${mName(m)}</div>
        <span class="m-arrow">›</span>
      </a>`).join("");
    hcHtml+=`<div class="cat-block">
      <div class="cat-label">${catName(cat)}</div>
      <div class="motivos-grid">${items}</div>
    </div>`;
  });

  panel.innerHTML=`
    <div class="panel-head">
      <div class="panel-esp-title">${currentEsp.icon} ${espName(currentEsp)}</div>
      <div class="panel-esp-sub pt">${subPt}</div>
      <div class="panel-esp-sub es">${subEs}</div>
    </div>
    <div class="tabs">
      <button class="tab-btn${currentTab==="hc"?" active":""}" onclick="setTab('hc')">${tabHc}</button>
      <button class="tab-btn${currentTab==="material"?" active":""}" onclick="setTab('material')">${tabMat}</button>
    </div>
    <div class="tab-pane${currentTab==="hc"?" active":""}" id="tab-hc">${hcHtml}</div>
    <div class="tab-pane${currentTab==="material"?" active":""}" id="tab-material">
      <div class="material-placeholder">
        <div class="mp-icon">📚</div>
        <div class="mp-title pt">Referência Clínica</div>
        <div class="mp-title es">Referencia Clínica</div>
        <div class="mp-sub pt">Resumos, guias clínicos e casos práticos de ${espName(currentEsp)} em breve.</div>
        <div class="mp-sub es">Resúmenes, guías clínicas y casos prácticos de ${espName(currentEsp)} pronto.</div>
        <span class="mp-badge pt">Em breve</span>
        <span class="mp-badge es">Próximamente</span>
      </div>
    </div>`;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function selectEsp(id){
  currentEsp = ESPECIALIDADES.find(e=>e.id===id)||null;
  currentTab = "hc";
  const url=new URL(window.location);
  id ? url.searchParams.set("esp",id) : url.searchParams.delete("esp");
  history.replaceState(null,"",url);
  renderSidebarEsp();
  renderDrawer();
  renderPanel();
  // scroll topo
  document.getElementById("panel").scrollTop=0;
}

function setTab(t){
  currentTab=t;
  renderPanel();
}

// ── LANG ──────────────────────────────────────────────────────────────────────
function setLang(lang){
  currentLang=lang;
  document.documentElement.setAttribute("data-lang",lang);
  document.getElementById("btn-es").classList.toggle("active",lang==="es");
  document.getElementById("btn-pt").classList.toggle("active",lang==="pt");
  renderSidebarEsp(); renderDrawer(); renderPanel();
  try{localStorage.setItem("am-lang",lang);}catch(e){}
}

// ── SIDEBAR / DRAWER ──────────────────────────────────────────────────────────
function openEspDrawer(){document.getElementById("esp-drawer").classList.add("open");document.getElementById("esp-drawer-backdrop").classList.add("open");}
function closeEspDrawer(){document.getElementById("esp-drawer").classList.remove("open");document.getElementById("esp-drawer-backdrop").classList.remove("open");}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded",()=>{
  try{const s=localStorage.getItem("am-lang");if(s==="pt"||s==="es")currentLang=s;}catch(e){}
  document.documentElement.setAttribute("data-lang",currentLang);
  document.getElementById("btn-es").classList.toggle("active",currentLang==="es");
  document.getElementById("btn-pt").classList.toggle("active",currentLang==="pt");

  const esp=new URLSearchParams(window.location.search).get("esp");
  if(esp) currentEsp=ESPECIALIDADES.find(e=>e.id===esp)||null;

  renderSidebarEsp();
  renderDrawer();
  renderPanel();

  // Auth + nome/plano do usuário no sidebar são tratados pelo dispatcher
  // de supabase-integration.js (PAGE === 'especialidades'), que só popula o
  // nome DEPOIS que a sessão resolve. Não chamar aqui para evitar nome vazio.
});
</script>
<script src="supabase-integration.js" defer></script>
<script src="sidebar.js"></script>
</body>
</html>
